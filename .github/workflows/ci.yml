# CI workflow for MyPDF
#
# Runs on every push (any branch) and on PRs targeting `main`.
#
# Jobs:
#   flutter-ci          — format + analyze + unit/widget tests (ubuntu-latest)
#   secret-scan         — gitleaks secret detection (ubuntu-latest)
#   osv-scan            — OSV dependency vulnerability scan (ubuntu-latest)
#   integration-android — integration_test/ on Android emulator (macos-latest, PR-only)
#   integration-web     — integration_test/ via flutter drive on headless Chromium (ubuntu-latest, PR-only)
#
# Flutter pinned to 3.44.0 (matches local; Dart SDK ^3.10.7 in pubspec.yaml).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    name: Flutter format + analyze + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the PR head directly instead of the auto-generated
          # merge commit (default). The merge commit can mix older base-branch
          # formatting with newer PR formatting, producing bytes that fail
          # `dart format --set-exit-if-changed` even when both sides are
          # individually clean.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib/ test/ integration_test/

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        # Exclude golden tests: pixel-diff PNGs were captured on dev (Windows)
        # and font rasterisation differs on Linux runners. Run goldens locally
        # via `flutter test test/golden/` instead.
        run: flutter test --coverage --reporter expanded --exclude-tags=golden,ocr-pipeline

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Secret scanning — detect accidentally committed credentials / tokens.
  # Runs on every push; blocks merge if any secret is found.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan — flags packages with known CVEs in the
  # OSV database (covers pub.dev, PyPI, npm, Go, etc.).
  # v2.x is a reusable workflow; called at the job level, not as a step.
  # upload-sarif disabled to avoid requiring GitHub Advanced Security.
  # ---------------------------------------------------------------------------
  osv-scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pubspec.lock
      upload-sarif: false
    permissions:
      contents: read
      actions: read
      security-events: write

  # ---------------------------------------------------------------------------
  # Web integration tests — flutter drive against headless Chrome.
  # Both google-chrome and chromedriver are pre-installed on ubuntu-latest.
  # flutter test -d chrome is NOT supported for integration_test; flutter
  # drive + chromedriver is the correct approach.
  # Gated to pull_request to keep push CI lean.
  # ---------------------------------------------------------------------------
  integration-web:
    name: Integration tests (web / headless Chrome)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Start ChromeDriver
        run: chromedriver --port=4444 &

      - name: Run web integration tests
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server \
            --browser-name=chrome \
            --headless
